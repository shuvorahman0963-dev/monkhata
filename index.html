<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one calm column like a pocket notebook; sticky header with tabs; cards only for the four daily blocks */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E6EAE3; --ink:#1B2631; --muted:#5B6863; --line:#D3D9D0;
  --accent:#2D6B62; --accent-soft:#DCEBE7; --on-accent:#FFFFFF; --mark:#B97D0C; --mark-soft:#F6EBD3;
  --good:#2E7A4E; --warn:#A8601A; --bad:#A93838;
  --f-display:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --f-num:ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#192027; --sunk:#222B33; --ink:#E3E9E5; --muted:#9AA7A1; --line:#2E3942;
  --accent:#6FB8AC; --accent-soft:#1F3A36; --on-accent:#0E1A18; --mark:#E2AE4A; --mark-soft:#3A2F1A;
  --good:#6CC08F; --warn:#E0A05A; --bad:#E07A7A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192027; --sunk:#222B33; --ink:#E3E9E5; --muted:#9AA7A1; --line:#2E3942;
  --accent:#6FB8AC; --accent-soft:#1F3A36; --on-accent:#0E1A18; --mark:#E2AE4A; --mark-soft:#3A2F1A;
  --good:#6CC08F; --warn:#E0A05A; --bad:#E07A7A; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand{font-family:var(--f-display);font-size:1.6rem;line-height:1.2;margin:0}
.status{font-size:.8rem;color:var(--muted);text-align:right}
.status b{font-weight:500;color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px;scrollbar-width:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.95rem;padding:6px 12px;border-radius:999px;cursor:pointer}
nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{padding-block:16px 48px;display:grid;gap:18px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;text-wrap:balance}
h3{font-size:1rem;font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.when{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mark);font-weight:600}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar h2{font-size:1.45rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.hint{background:var(--mark-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.hint b{color:var(--mark)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:8px 10px;width:100%;min-width:0}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:120px;line-height:1.7}
textarea.tall{min-height:260px}
.dump{display:grid;gap:6px;counter-reset:d}
.dump-row{display:grid;grid-template-columns:28px 1fr 36px;gap:6px;align-items:center}
.dump-row .n{font-family:var(--f-num);font-size:.8rem;color:var(--muted);text-align:right}
.star{border:0;background:transparent;color:var(--line);font-size:1.25rem;cursor:pointer;border-radius:8px;height:36px}
.star[aria-pressed="true"]{color:var(--mark)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{flex:1 1 0;min-width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;padding:8px 4px;border-radius:10px;cursor:pointer;line-height:1.25}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale.tight button{min-width:34px;padding:6px 2px;font-family:var(--f-num)}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;background:var(--surface)}
.chip input{width:auto;accent-color:var(--accent)}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-size:.92rem;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tdisp{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
details{border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:10px}
.cbt{display:grid;gap:8px}
.cbt textarea{min-height:64px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:600}
.stat .k{font-size:.8rem;color:var(--muted)}
.who{display:grid;gap:14px}
.who-q{display:grid;gap:6px}
.score{font-family:var(--f-num);font-size:1.6rem;font-weight:600}
.note{border-left:3px solid var(--warn);padding:6px 12px;font-size:.92rem;background:var(--sunk);border-radius:0 10px 10px 0}
.note.bad{border-color:var(--bad)}
.qa{display:grid;gap:10px}
.qa .q{font-weight:500}
.qa textarea{min-height:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > input{flex:1 1 220px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:480px;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.2}
.chart .dot{fill:var(--accent)}
.chart .bar{fill:var(--mark);opacity:.75}
.chart .ref{stroke:var(--good);stroke-dasharray:4 4;stroke-width:1.2}
.pattern{display:grid;gap:4px;padding:12px;border-radius:12px;background:var(--sunk)}
.pattern .cmp{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sessions{display:grid;gap:12px}
.sess{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.sess.done{background:var(--sunk)}
.sess.locked{opacity:.55}
.pill{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pblist{display:flex;gap:8px;flex-wrap:wrap}
ol.road{margin:0;padding-left:1.2em;display:grid;gap:6px}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:4px}
.sos{width:100%;border:0;background:var(--bad);color:#fff;font:inherit;font-size:1.05rem;font-weight:600;padding:14px;border-radius:12px;cursor:pointer}
.big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:2.2rem;font-weight:600;line-height:1.1}
.surf{border:2px solid var(--accent);background:var(--accent-soft)}
.step{font-size:1.1rem;font-family:var(--f-display);line-height:1.6}
.reasons{margin:0;padding-left:1.2em;display:grid;gap:2px}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:420px}
.cal span{aspect-ratio:1;border-radius:6px;background:var(--sunk);max-width:100%}
.cal span.ok{background:var(--good)}
.cal span.lapse{background:var(--bad)}
.cal span.half{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:minmax(0,9em) 1fr 2.5em;gap:8px;align-items:center;font-size:.88rem}
.barrow .track{background:var(--sunk);border-radius:6px;height:10px;overflow:hidden}
.barrow .fill{background:var(--mark);height:100%}
.barrow .c{font-family:var(--f-num);text-align:right}
.urge{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:.9rem}
.ifthen{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:520px){.ifthen{grid-template-columns:1fr}}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <h1 class="brand">মনখাতা</h1>
      <div class="status" id="status">লোড হচ্ছে…</div>
    </div>
    <nav id="tabs" aria-label="বিভাগ">
      <button data-tab="today">আজ</button>
      <button data-tab="week">সাপ্তাহিক</button>
      <button data-tab="deep">গভীর লেখা</button>
      <button data-tab="reset">রিসেট</button>
      <button data-tab="insights">ইনসাইট</button>
      <button data-tab="guide">গাইড</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const HABITS=[["meditation","মেডিটেশন"],["prayer","নামাজ / প্রার্থনা"],["study","পড়াশোনা"],["sunlight","সকালের রোদ"],["social","কারো সাথে কথা / দেখা"],["nophone","ঘুমের আগে ফোন বন্ধ"]];
const MOODS=["খুব খারাপ","খারাপ","ঠিকঠাক","ভালো","খুব ভালো"];
const LEVELS=["খুব কম","কম","মাঝারি","বেশি","খুব বেশি"];
const WHO5=["আমি প্রফুল্ল ও ভালো মেজাজে ছিলাম","আমি শান্ত ও নির্ভার অনুভব করেছি","আমি সক্রিয় ও উদ্যমী অনুভব করেছি","ঘুম থেকে উঠে সতেজ ও বিশ্রাম নেওয়া লেগেছে","আমার প্রতিদিনের জীবন আগ্রহের জিনিসে ভরা ছিল"];
const WHO5_OPTS=["কখনো না","মাঝে মাঝে","অর্ধেকের কম সময়","অর্ধেকের বেশি সময়","বেশিরভাগ সময়","সবসময়"];
const BN_MONTHS=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const BN_DAYS=["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
const LOCAL_KEY="monkhata-v1";
const TRIGGERS=["একা থাকা","বোরডম","স্ট্রেস","মন খারাপ","রাতে বিছানায় ফোন","সোশ্যাল মিডিয়া স্ক্রল","ঘুম আসছে না","ঝগড়া বা রাগ","কোনো ছবি বা ভিডিও চোখে পড়েছে","অন্য কিছু"];
const HALT=["ক্ষুধা","রাগ","একাকীত্ব","ক্লান্তি"];
const OUTCOMES=[["passed","তাড়না চলে গেছে"],["alt","বিকল্প কাজ করেছি"],["lost","হেরে গেছি"]];
const ALTS=["রুম থেকে বের হও, দরজা খোলা রাখো","ঠান্ডা পানিতে মুখ ধোও বা গোসল করো","২০টা পুশ-আপ বা স্কোয়াট","কাউকে ফোন বা মেসেজ দাও","ওজু করে নামাজ পড়ো বা দোয়া করো","বাইরে ১০ মিনিট হাঁটো","ফোন অন্য রুমে রেখে আসো"];
const ENV=[["blocker","ফোন আর কম্পিউটারে কনটেন্ট ব্লকার চালু"],["phoneout","রাতে ফোন বেডরুমের বাইরে"],["cleanfeed","ট্রিগার করে এমন অ্যাকাউন্ট আনফলো"],["deleted","সেভ করা কনটেন্ট মুছে ফেলেছি"],["partner","একজন বিশ্বস্ত মানুষ জানে (accountability)"],["sleep","প্রতিদিন একই সময়ে ঘুম"]];
const SURF_STEPS=[[0,"থামো। ৫টা ধীর নিঃশ্বাস নাও: ৪ সেকেন্ডে নাও, ৬ সেকেন্ডে ছাড়ো।"],[2,"তাড়নাটা শরীরের কোথায় টের পাচ্ছ? শুধু লক্ষ্য করো। লড়াই করতে হবে না, মানতেও হবে না।"],[5,"এটা একটা ঢেউ। উঠছে, চূড়ায় যাবে, তারপর নামবে। তুমি ঢেউয়ের ওপর ভাসছ, ডুবছ না।"],[10,"এখন তীব্রতা কত? খেয়াল করো, শুরুর চেয়ে কমেছে কিনা। চাইলে নিচের একটা বিকল্প কাজ করো।"],[15,"ঢেউ পার হয়ে গেছ। নিচে লিখে রাখো কী সাহায্য করেছে।"]];
const blankRec=()=>({p:null,m:null,urges:[],review:{before:"",feeling:"",thought:"",moment:"",next:"",kind:""},reflect:""});

const main=document.getElementById("main");
const statusEl=document.getElementById("status");
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const today=()=>ymd(new Date());
const fmtDate=s=>{const d=parse(s);return bn(d.getDate())+" "+BN_MONTHS[d.getMonth()]+", "+BN_DAYS[d.getDay()]};
const fmtShort=s=>{const d=parse(s);return bn(d.getDate())+" "+BN_MONTHS[d.getMonth()]};
const words=t=>(t||"").trim().split(/\s+/).filter(Boolean).length;
const num=v=>v===""||v==null||isNaN(Number(v))?null:Number(v);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fix=(v,d=1)=>v==null?"–":bn(v.toFixed(d));

/* ---------- data ---------- */
let store=null, loaded=false;
let docs={};
const dirty=new Set(), timers={}, writing={}, ver={};
let view={tab:"today",date:today(),rdate:today(),week:monday(today()),pb:null,aiMsg:"",surf:null};

function blank(id){
  if(id==="recovery") return {kind:"recovery",start:"",reasons:["","","","",""],ifthen:[0,1,2,3,4].map(()=>({if:"",then:""})),env:{}};
  if(id.startsWith("day-")) return {kind:"day",date:id.slice(4),dump:Array(10).fill(""),focus:null,mood:null,energy:null,stress:null,bed:"",wake:"",exercise:"",water:"",screen:"",deepwork:"",habits:{},grat:["","",""],free:"",cbt:{situation:"",thought:"",evidence:"",balanced:""}};
  if(id.startsWith("week-")) return {kind:"week",start:id.slice(5),who5:[null,null,null,null,null],ai:{topic:"",qs:[],as:["","","","",""]},bps:"",review:""};
  return {kind:"pb",title:"",created:today(),sessions:[0,1,2,3].map(()=>({text:"",before:null,after:null,done:false,date:""}))};
}
const doc=id=>docs[id]||(docs[id]=blank(id));
const peek=id=>docs[id]||null;

function setPath(o,path,val){
  const ks=path.split(".");let t=o;
  for(let i=0;i<ks.length-1;i++){const k=ks[i];if(t[k]==null)t[k]=/^\d+$/.test(ks[i+1])?[]:{};t=t[k]}
  t[ks[ks.length-1]]=val;
}
const getPath=(o,path)=>path.split(".").reduce((t,k)=>t==null?t:t[k],o);

function touch(id){
  dirty.add(id);ver[id]=(ver[id]||0)+1;
  setStatus("saving");
  clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),900);
}
async function flush(id){
  if(writing[id]){timers[id]=setTimeout(()=>flush(id),400);return}
  writing[id]=true;const v=ver[id];
  const data=JSON.parse(JSON.stringify({...docs[id],updated:Date.now()}));
  try{
    if(store.mode==="cloud") store.col.doc(id).set(data).catch(()=>setStatus("error","সেভ হয়নি, আবার লগইন করে দেখো"));
    else saveLocal();
    if(ver[id]===v) dirty.delete(id);
    setStatus(dirty.size?"saving":"saved");
  }catch(e){
    setStatus("error",e&&e.code==="quota_exceeded"?"জায়গা শেষ, পুরনো লেখা মুছতে হবে":"সেভ হয়নি, আবার চেষ্টা হচ্ছে");
    timers[id]=setTimeout(()=>flush(id),4000);
  }finally{writing[id]=false}
}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(docs))}catch(e){}}
function loadLocal(){try{const s=localStorage.getItem(LOCAL_KEY);if(s)docs=JSON.parse(s)||{}}catch(e){docs={}}}

function setStatus(kind,msg){
  const where=store?.mode==="cloud"?"<b>সব ডিভাইসে সিঙ্ক</b>":store?.mode==="signin"?"লগইন দরকার":"শুধু এই ডিভাইসে সেভ";
  const s=kind==="saving"?"সেভ হচ্ছে…":kind==="error"?msg:kind==="saved"?"সেভ হয়েছে":"";
  statusEl.innerHTML=where+(s?"<br>"+esc(s):"");

let unsub=null;
async function init(){
  render();
  const cfg=window.FIREBASE_CONFIG;
  if(!(window.firebase&&cfg&&cfg.apiKey&&!String(cfg.apiKey).startsWith("PASTE"))){
    store={mode:"local"};loadLocal();loaded=true;setStatus("");render();return;
  }
  firebase.initializeApp(cfg);
  const fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  firebase.auth().onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    docs={};dirty.clear();
    if(!u){store={mode:"signin"};loaded=true;setStatus("");render();return}
    store={mode:"cloud",col:fs.collection("users").doc(u.uid).collection("docs")};loaded=false;render();
    unsub=store.col.onSnapshot(onSnap,()=>setStatus("error","সিঙ্ক বন্ধ হয়ে গেছে, পেজ রিলোড করো"));
  });
}

function onSnap(snap){
  for(const ch of snap.docChanges()){
    const id=ch.doc.id;
    if(dirty.has(id))continue;
    if(ch.type==="removed")delete docs[id];
    else docs[id]=JSON.parse(JSON.stringify(ch.doc.data()));
  }
  const first=!loaded;loaded=true;
  if(first)setStatus("");
  const a=document.activeElement;
  if(first||!(a&&main.contains(a)&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")))render();
}

/* ---------- derived ---------- */
const mins=t=>{if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m};
function sleepHrs(d){const b=mins(d.bed),w=mins(d.wake);if(b==null||w==null)return null;let x=w-b;if(x<=0)x+=1440;return x/60}
const journaled=d=>!!d&&((d.dump||[]).some(x=>x&&x.trim())||(d.grat||[]).some(x=>x&&x.trim())||!!(d.free&&d.free.trim()));
function dayList(){return Object.keys(docs).filter(k=>k.startsWith("day-")).map(k=>docs[k]).sort((a,b)=>a.date<b.date?-1:1)}
function streak(){
  let s=today(),n=0;
  if(!journaled(peek("day-"+s)))s=addDays(s,-1);
  while(journaled(peek("day-"+s))){n++;s=addDays(s,-1)}
  return n;
}
function phase(){
  const first=dayList().find(journaled);
  if(!first)return {w:0,text:"আজ প্রথম দিন। শুধু সকালের ১০টা চিন্তা লিখে শুরু করো।"};
  const days=Math.round((parse(today())-parse(first.date))/864e5);const w=Math.floor(days/7)+1;
  const t=w<=2?"শুধু সকালের Thought Dump আর রাতের ৩টা কৃতজ্ঞতা লিখলেই যথেষ্ট।"
    :w<=4?"এখন রাতের চেক-ইন আর ৫ মিনিট Free Flow যোগ করো।"
    :w<=8?"এখন শুক্রবারে সাপ্তাহিক রিভিউ যোগ করো।"
    :w<=13?"দরকার মনে হলে ‘গভীর লেখা’ প্রোটোকলটা একবার করো।"
    :"৩ মাস পূর্ণ হয়েছে। পুরনো লেখাগুলো পড়ে দেখো, কী বদলেছে।";
  return {w,text:t};
}
function sd(a){if(a.length<2)return null;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))}
function weekStats(start){
  const ds=[0,1,2,3,4,5,6].map(i=>peek("day-"+addDays(start,i))).filter(Boolean);
  const moods=ds.map(d=>d.mood).filter(v=>v!=null);
  const sl=ds.map(sleepHrs).filter(v=>v!=null);
  const wk=ds.map(d=>mins(d.wake)).filter(v=>v!=null);
  return {mood:avg(moods),sleep:avg(sl),wakeSd:sd(wk),ex:ds.reduce((s,d)=>s+(num(d.exercise)||0),0),
    jdays:ds.filter(journaled).length,screen:avg(ds.map(d=>num(d.screen)).filter(v=>v!=null))};
}

function scale(path,val,labels,start=1){
  return '<div class="scale" role="group">'+labels.map((l,i)=>{const v=i+start;
    return `<button type="button" data-set="${path}" data-v="${v}" aria-pressed="${val===v}">${esc(l)}</button>`}).join("")+"</div>";
}
function numScale(path,val,from,to){
  let s='<div class="scale tight" role="group">';
  for(let v=from;v<=to;v++)s+=`<button type="button" data-set="${path}" data-v="${v}" aria-pressed="${val===v}">${bn(v)}</button>`;
  return s+"</div>";
}

function rInsights(){
  const days=[];for(let i=29;i>=0;i--){const s=addDays(today(),-i);days.push({date:s,d:peek("day-"+s)})}
  const filled=days.filter(x=>x.d);
  if(!filled.some(x=>x.d.mood!=null||journaled(x.d)))
    return `<div class="empty">গত ৩০ দিনের মুড, ঘুম আর অভ্যাসের গ্রাফ এখানে দেখাবে। ‘আজ’ ট্যাবে চেক-ইন দিলে শুরু হবে।</div>`;
  const W=640,H=150,L=28,R=8,T=10,B=24,iw=W-L-R,ih=H-T-B,step=iw/29;
  const x=i=>L+i*step;
  let mood=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="৩০ দিনের মুড">`;
  for(let v=1;v<=5;v++){const y=T+(5-v)/4*ih;mood+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${v}</text>`}
  let seg=[],paths=[];
  days.forEach((o,i)=>{const m=o.d?.mood;if(m!=null)seg.push([x(i),T+(5-m)/4*ih]);else if(seg.length){paths.push(seg);seg=[]}});
  if(seg.length)paths.push(seg);
  paths.forEach(p=>{mood+=`<polyline class="line" points="${p.map(q=>q.join(",")).join(" ")}"/>`;p.forEach(q=>mood+=`<circle class="dot" cx="${q[0]}" cy="${q[1]}" r="3"/>`)});
  [0,7,14,21,29].forEach(i=>mood+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${fmtShort(days[i].date)}</text>`);
  mood+="</svg>";
  let sleep=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="৩০ দিনের ঘুম">`;
  [0,4,8,12].forEach(v=>{const y=T+(12-v)/12*ih;sleep+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${v}</text>`});
  const y7=T+(12-7)/12*ih;sleep+=`<line class="ref" x1="${L}" x2="${W-R}" y1="${y7}" y2="${y7}"/>`;
  days.forEach((o,i)=>{const h=o.d?sleepHrs(o.d):null;if(h!=null){const hh=Math.min(h,12)/12*ih;sleep+=`<rect class="bar" x="${x(i)-step*0.35}" y="${T+ih-hh}" width="${step*0.7}" height="${hh}" rx="2"/>`}});
  [0,7,14,21,29].forEach(i=>sleep+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${fmtShort(days[i].date)}</text>`);
  sleep+="</svg>";

  const all=dayList().filter(d=>d.mood!=null);
  const cmp=(label,pa,la,lb)=>{
    const a=all.filter(pa),b=all.filter(d=>!pa(d)&&pa(d)!==null);
    const ma=avg(a.map(d=>d.mood)),mb=avg(b.map(d=>d.mood));
    if(a.length<3||b.length<3)return `<div class="pattern"><h3>${label}</h3><p class="small muted">আরও ডেটা দরকার (প্রতি দলে অন্তত ৩ দিন)। এখন: ${bn(a.length)} আর ${bn(b.length)} দিন।</p></div>`;
    const diff=ma-mb;
    return `<div class="pattern"><h3>${label}</h3><p class="cmp">${la}: গড় মুড ${fix(ma)} · ${lb}: ${fix(mb)}</p>
      <p class="small muted">${Math.abs(diff)<0.3?"তেমন পার্থক্য দেখা যাচ্ছে না।":diff>0?`${la} দিনগুলোতে মুড ${fix(diff)} পয়েন্ট ভালো।`:`${lb} দিনগুলোতে মুড ${fix(-diff)} পয়েন্ট ভালো।`}</p></div>`;
  };
  const hasSleep=d=>sleepHrs(d)!=null;
  const patterns=[
    cmp("ঘুম আর মুড",d=>hasSleep(d)?sleepHrs(d)>=7:null,"৭+ ঘণ্টা ঘুম","৭ ঘণ্টার কম"),
    cmp("ব্যায়াম আর মুড",d=>num(d.exercise)==null?null:num(d.exercise)>=20,"২০+ মিনিট ব্যায়াম","কম বা না"),
    cmp("স্ক্রিন টাইম আর মুড",d=>num(d.screen)==null?null:num(d.screen)<=5,"৫ ঘণ্টা বা কম স্ক্রিন","৫ ঘণ্টার বেশি"),
    cmp("জার্নালিং আর মুড",d=>journaled(d),"জার্নালিং করা দিন","না করা দিন"),
    cmp("রিসেট আর মুড",d=>d.rec&&(d.rec.p!=null||d.rec.m!=null)?(d.rec.p!==1&&d.rec.m!==1):null,"ক্লিন দিন","পিছলে পড়ার দিন"),
  ].join("");
  const last7=days.slice(-7).map(o=>o.d?.mood).filter(v=>v!=null);
  const low=last7.filter(v=>v<=2).length;
  const habitRows=HABITS.map(([k,l])=>{const n=filled.filter(o=>o.d.habits?.[k]).length;return `<div class="stat"><div class="v">${bn(n)}</div><div class="k">${l} (৩০ দিনে)</div></div>`}).join("");
  return `
  ${low>=5?`<div class="note bad">গত ৭ দিনের ${bn(low)} দিনই মুড খারাপ ছিল। কাছের কারো সাথে কথা বলো, আর একজন কাউন্সেলর বা সাইকিয়াট্রিস্ট দেখাও। জরুরি অবস্থায় ৯৯৯।</div>`:""}
  <section class="card"><div class="card-head"><h2>মুড, গত ৩০ দিন</h2><span class="small muted">টানা ${bn(streak())} দিন জার্নালিং</span></div><div class="chart">${mood}</div></section>
  <section class="card"><div class="card-head"><h2>ঘুম, গত ৩০ দিন</h2><span class="small muted">সবুজ দাগ = ৭ ঘণ্টা</span></div><div class="chart">${sleep}</div></section>
  <section class="card"><h2>কোন জিনিস তোমার মুডে প্রভাব ফেলছে</h2>${patterns}<p class="small muted">এগুলো শুধু মিল, প্রমাণ না। যত বেশি দিন ট্র্যাক করবে, তত নির্ভরযোগ্য হবে।</p></section>
  <section class="card"><h2>অভ্যাস</h2><div class="stats">${habitRows}</div></section>`;
}

function recStreak(key){
  const start=peek("recovery")?.start;if(!start)return {cur:0,best:0};
  let cur=0,best=0,run=0;
  for(let s=start;s<=today();s=addDays(s,1)){
    if(peek("day-"+s)?.rec?.[key]===1)run=0;else run++;
    best=Math.max(best,run);
  }
  cur=run;return {cur,best};
}

    <div class="field"><span class="lbl">যদি-তাহলে প্ল্যান</span>
      ${plan.ifthen.map((x,i)=>`<div class="ifthen"><input id="if-${i}" data-f="ifthen.${i}.if" value="${esc(x.if)}" placeholder="${i?"যদি…":"যদি রাতে বিছানায় ফোন হাতে থাকে"}" aria-label="যদি ${bn(i+1)}"><input id="then-${i}" data-f="ifthen.${i}.then" value="${esc(x.then)}" placeholder="${i?"তাহলে…":"তাহলে ফোন অন্য রুমে চার্জে দেব"}" aria-label="তাহলে ${bn(i+1)}"></div>`).join("")}</div>

function rResetPatterns(start){
  const ds=[];for(let i=29;i>=0;i--){const s=addDays(today(),-i);ds.push({s,d:peek("day-"+s)})}
  const cal=ds.map(({s,d})=>{const r=d?.rec;let c="";if(r){const lp=r.p===1||r.m===1;if(lp)c=(r.p===1&&r.m===1)?"lapse":"half";else if(r.p===0||r.m===0)c="ok"}
    return `<span class="${c}" title="${fmtShort(s)}"></span>`}).join("");
  const urges=ds.flatMap(({d})=>d?.rec?.urges||[]);
  const tcount={};urges.forEach(u=>(u.triggers||[]).concat(u.halt||[]).forEach(t=>tcount[t]=(tcount[t]||0)+1));
  const top=Object.entries(tcount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=top.length?top[0][1]:1;
  const buckets=[["সকাল (৫–১২)",5,12],["দুপুর (১২–৫)",12,17],["সন্ধ্যা (৫–৯)",17,21],["রাত (৯–১)",21,25],["গভীর রাত (১–৫)",1,5]];
  const bcount=buckets.map(([l,a,b])=>[l,urges.filter(u=>{let h=Number((u.t||"0").split(":")[0]);if(a===21&&h<1)h+=24;return h>=a&&h<b}).length]);
  const bmax=Math.max(1,...bcount.map(x=>x[1]));
  const won=urges.filter(u=>u.outcome&&u.outcome!=="lost").length;
  const bar=(l,c,m)=>`<div class="barrow"><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${c/m*100}%"></div></div><span class="c">${bn(c)}</span></div>`;
  return `<section class="card">
    <h2>প্যাটার্ন, গত ৩০ দিন</h2>
    <div class="cal">${cal}</div>
    <div class="legend"><span><i style="background:var(--good)"></i>ক্লিন</span><span><i style="background:var(--warn)"></i>একটায় পিছলে পড়া</span><span><i style="background:var(--bad)"></i>দুটোতেই</span><span><i style="background:var(--sunk)"></i>লেখা নেই</span></div>
    ${urges.length?`
    <p><b>${bn(urges.length)}টা তাড়নার ${bn(won)}টা পার হয়েছ</b> <span class="muted">(${bn(Math.round(won/urges.length*100))}%)</span></p>
    <h3>সবচেয়ে বেশি ট্রিগার</h3><div class="bars">${top.map(([t,c])=>bar(t,c,max)).join("")}</div>
    <h3>কোন সময়ে তাড়না বেশি আসে</h3><div class="bars">${bcount.map(([l,c])=>bar(l,c,bmax)).join("")}</div>
    <p class="small muted">যে সময় আর ট্রিগার সবচেয়ে বেশি, সেটার জন্য একটা যদি-তাহলে প্ল্যান বানাও।</p>`
    :`<p class="small muted">তাড়না এলে ‘এখন তাড়না হচ্ছে’ বোতাম চেপে লগ করো। কয়েকটা লগ হলে এখানে তোমার ট্রিগার আর ঝুঁকির সময় দেখাবে।</p>`}
  </section>`;
}

/* ---------- timer ---------- */
let timer=null;
function tick(){
  const st=document.querySelector("[data-surfstep]");
  if(st&&timer&&timer.key==="surf"){const el=(Date.now()-(timer.end-15*60000))/60000;let txt=SURF_STEPS[0][1];SURF_STEPS.forEach(([m,t])=>{if(el>=m)txt=t});if(st.textContent!==txt)st.textContent=txt}
  document.querySelectorAll("[data-tdisp]").forEach(el=>{
    const k=el.dataset.tdisp,btn=document.querySelector(`[data-timer="${k}"]`);
    if(timer&&timer.key===k){
      const left=Math.max(0,timer.end-Date.now());
      el.textContent=left?bn(z(Math.floor(left/60000))+":"+z(Math.floor(left/1000)%60)):"সময় শেষ। চাইলে আরও লেখো।";
      if(btn)btn.textContent=left?"থামাও":"আবার শুরু";
      if(!left)timer.finished=true;
    }else{el.textContent="";if(btn&&btn.dataset.label)btn.textContent=btn.dataset.label}
  });
}
setInterval(()=>{if(timer&&!timer.finished)tick()},1000);

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]");if(!b)return;
  view.tab=b.dataset.tab;try{history.replaceState(null,"","#"+view.tab)}catch(_){}
  render();window.scrollTo(0,0);
});
main.addEventListener("input",e=>{
  const el=e.target,f=el.dataset.f;
  if(el.hasAttribute("data-sn")&&view.surf){view.surf.note=el.value;return}
  if(!f)return;
  const host=el.closest("[data-doc]");if(!host)return;
  const id=host.dataset.doc,d=doc(id);
  setPath(d,f,el.type==="checkbox"?el.checked:el.value);
  touch(id);
  if(f==="bed"||f==="wake"){const p=host.querySelector("p.small.muted");if(p&&id.startsWith("day-")){const h=sleepHrs(d);p.textContent="ঘুম: "+(h==null?"সময় দুটো দিলে হিসাব হবে":fix(h)+" ঘণ্টা")}}
  if(el.tagName==="TEXTAREA"){const c=el.nextElementSibling;if(c&&c.classList.contains("small"))c.textContent=bn(words(el.value))+" শব্দ";
    const btn=host.querySelector(`[data-act="pbdone"]`);if(btn&&f.endsWith(".text"))btn.disabled=words(el.value)<20}
});
main.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  const host=t.closest("[data-doc]"),id=host?.dataset.doc;
  if(t.dataset.set){const d=doc(id),v=Number(t.dataset.v);setPath(d,t.dataset.set,getPath(d,t.dataset.set)===v?null:v);touch(id);render();return}
  if(t.dataset.focus){const d=doc(id),i=Number(t.dataset.focus);d.focus=d.focus===i?null:i;touch(id);render();return}
  if(t.dataset.nav){view.date=t.dataset.nav==="0"?today():addDays(view.date,Number(t.dataset.nav));if(view.date>today())view.date=today();render();return}
  if(t.dataset.wnav){view.week=addDays(view.week,Number(t.dataset.wnav));view.aiMsg="";render();return}
  if(t.dataset.timer){const k=t.dataset.timer;if(!t.dataset.label)t.dataset.label=t.textContent;
    if(timer&&timer.key===k&&!timer.finished){timer=null}else{timer={key:k,end:Date.now()+Number(t.dataset.min)*60000}}
    tick();if(k==="surf")return;const ta=t.closest(".field,section,.sess")?.querySelector("textarea");if(ta&&timer)ta.focus();return}
  if(t.dataset.pb){view.pb=t.dataset.pb;render();return}
  if(t.dataset.rnav){view.rdate=addDays(view.rdate,Number(t.dataset.rnav));if(view.rdate>today())view.rdate=today();render();return}
  if(t.dataset.ss&&view.surf){const k=t.dataset.ss,v=Number(t.dataset.v);view.surf[k]=view.surf[k]===v?null:v;render();return}
  if(t.dataset.st&&view.surf){const a=view.surf[t.dataset.st],v=t.dataset.v,i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);render();return}
  if(t.dataset.so&&view.surf){view.surf.outcome=t.dataset.so;render();return}
  const act=t.dataset.act;
  if(act==="signin"){const p=new firebase.auth.GoogleAuthProvider();view.authMsg="";
    try{await firebase.auth().signInWithPopup(p)}catch(err){
      if(err&&(err.code==="auth/popup-blocked"||err.code==="auth/operation-not-supported-in-this-environment"))firebase.auth().signInWithRedirect(p);
      else if(!(err&&err.code==="auth/popup-closed-by-user")){view.authMsg="লগইন হয়নি: "+(err&&err.code||"অজানা সমস্যা");render()}}
    return}
  if(act==="signout"){firebase.auth().signOut();return}
  if(act==="export"){const blob=new Blob([JSON.stringify({app:"monkhata",exported:new Date().toISOString(),docs})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="monkhata-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
    view.dataMsg="ব্যাকআপ ডাউনলোড হয়েছে।";render();return}
  if(act==="recstart"){const p=doc("recovery");p.start=today();touch("recovery");render();return}
  if(act==="surf"){view.surf={start:Date.now(),before:null,after:null,triggers:[],halt:[],outcome:null,note:""};render();window.scrollTo(0,0);return}
  if(act==="surfcancel"){view.surf=null;if(timer&&timer.key==="surf")timer=null;render();return}
  if(act==="surfsave"){const s=view.surf,now=new Date(s.start),dId="day-"+ymd(now),d=doc(dId);if(!d.rec)d.rec=blankRec();if(!d.rec.urges)d.rec.urges=[];
    d.rec.urges.push({t:z(now.getHours())+":"+z(now.getMinutes()),before:s.before,after:s.after,triggers:s.triggers,halt:s.halt,outcome:s.outcome,note:s.note});
    touch(dId);view.surf=null;view.rdate=ymd(now);if(timer&&timer.key==="surf")timer=null;render();return}
  if(act==="newpb"){const inp=document.getElementById("pb-title");const title=inp.value.trim();if(!title){inp.focus();inp.placeholder="আগে ঘটনার একটা ছোট নাম দাও";return}
    const nid="pb-"+Date.now().toString(36);const p=doc(nid);p.title=title;touch(nid);view.pb=nid;render();return}
  if(act==="pbdone"){const i=Number(t.dataset.i),p=doc(id);p.sessions[i].done=true;p.sessions[i].date=today();touch(id);timer=null;render();return}
  if(act==="genq")return genQuestions(id);
});

async function genQuestions(id){
  const topic=(doc(id).ai.topic||"").trim();
  if(!topic){view.aiMsg="আগে বিষয়টা লেখো।";render();return}
  const prompt=`আমি জার্নালিং করছি। এই সপ্তাহের বিষয়: "${topic}"। আমাকে আত্মবিশ্লেষণে সাহায্য করতে বাংলায় ঠিক ৫টা খোলা প্রশ্ন দাও। প্রশ্নগুলো নরম, বিচারহীন আর নির্দিষ্ট হবে, যাতে লিখতে লিখতে আসল কারণ বের হয়।`;
  try{await navigator.clipboard.writeText(prompt);view.aiMsg="কপি হয়েছে। ChatGPT বা Claude-এ পেস্ট করো, তারপর পাওয়া ৫টা প্রশ্ন নিচের ঘরগুলোতে বসাও।"}
  catch(e){view.aiMsg="কপি করা গেল না। ChatGPT বা Claude-কে লেখো: "+prompt}
  render();
}
main.addEventListener("change",async e=>{
  if(e.target.id!=="import-file")return;
  const f=e.target.files[0];if(!f)return;
  try{
    const obj=JSON.parse(await f.text()),src=obj.docs||obj;let n=0;
    for(const [k,v] of Object.entries(src)){
      if(!/^(day-|week-|pb-|recovery$)/.test(k)||!v||typeof v!=="object")continue;
      docs[k]=v;touch(k);n++;
    }
    view.dataMsg=bn(n)+"টা এন্ট্রি ফেরত আনা হয়েছে।";
  }catch(_){view.dataMsg="ফাইলটা পড়া যায়নি। মনখাতার ব্যাকআপ ফাইল বেছে নাও।"}
  render();
});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
const h=(location.hash||"").slice(1);
if(["today","week","deep","reset","insights","guide"].includes(h))view.tab=h;
init();
</script>
